name: Refresh Profile Dashboard

on:
  schedule:
    # 06:00 IST daily (00:30 UTC)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate and commit dark analytics cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: mohanraj-official
          BRANCH_NAME: main
          THEME: github_dark
          TIME_ZONE: Asia/Kolkata
          NAME: Mohanraj S
